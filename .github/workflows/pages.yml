name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The dashboard fetches `../data/judgments.json` and `../spike/trace-*/`
      # relative to itself, so we publish the whole repo. A landing page at
      # the root redirects to dashboard/.
      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r dashboard data spike rules _site/
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>Habeas Protocol</title>
          <meta http-equiv="refresh" content="0; url=dashboard/">
          <p><a href="dashboard/">Habeas Protocol — dashboard</a></p>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
